<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Grade Statistics</title>
    <link rel="stylesheet" type="text/css" href="113308004_JS2_Lab4.css">
    

</head>
<body>
	<h1>Grade Statistics</h1>
    <div>
        <input type="number" id="math" placeholder="Math">
        <input type="number" id="english" placeholder="English">
        <button id="submitBtn" value="Submit">Submit</button>
    </div>

    <table id="gradeTable">
        <thead>
            <tr>
            	<th>#</th>
                <th>Math</th>
                <th>English</th>
                <th>Average</th>
            </tr>
        </thead>

        <tbody id="tableBody"></tbody>

        <tfoot>
            <tr>
                <td><strong>Average</strong></td>
                <td id="mathAvg">-</td>
                <td id="engAvg">-</td>
                <td id="overallAvg">-</td>
            </tr>
        </tfoot>
    </table>

    
<script src="113308004_JS2_Lab4.js"></script>
</body>
</html>
