<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Number Guessing Game</title>
</head>
<body>
	<h1>113308004_Number Guessing Game</h1>
	<div id="result"></div>
	<script>
		var answer = Math.floor(Math.random() * 100) + 1;
		var min = 1;
		var max = 100;
		var chances = 7;
	    var input = window.prompt('請輸入1到100之間的整數，你還有7次機會。');
		while (chances > 0){
			if (input === null || input.trim() === ""){
				alert("無效輸入，請輸入數字。");
				input = window.prompt('請輸入' + min + '到' + max + '之間的整數，你還有' + chances + '次機會。');
				continue;
			}
            if (isNaN(input)){
            	alert("無效輸入，請輸入有效數字。");
            	input = window.prompt('請輸入' + min + '到' + max + '間的整數，你還有' + chances + '次機會。');
            	continue;
            }
            var guess = Number(input);
            if (guess <= min || guess >= max){
            	alert("請輸入有效範圍內的數字(不能超出" + min + "到" + max + ")!")
            	input = window.prompt('請輸入' + min + '到' + max + '間的整數，你還有' + chances + '次機會。');
            	continue;
            }
       
            if (guess === answer) {
                alert("恭喜你答對了!正確答案是" + answer);
                document.getElementById("result").innerHTML = '<img src="correct.jpg" alt ="correct img">';
               break;
            }
        
            if (guess < answer) {
                alert("太小!");
                min = guess;
            } else {
                alert("太大!");
                max = guess;
            }
            chances--;
          
            if (chances === 0) {
                alert("機會用完了!正確答案是" + answer);
                document.getElementById("result").innerHTML = '<img src="wrong.jpg" alt = "wrong img">';
                break;
            }
            input = window.prompt('請輸入' + min + '到' + max + '間的整數，你還有' + chances + '次機會。');

		}
	</script>
</body>
</html>
